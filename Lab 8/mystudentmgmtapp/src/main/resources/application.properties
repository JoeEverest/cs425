spring.application.name=MyStudentMgmtApp

# --- MySQL datasource (runs in the Docker container defined in docker-compose.yml) ---
spring.datasource.url=jdbc:mysql://localhost:3307/studentmgmt?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=studentmgmt
spring.datasource.password=studentmgmt
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' lets Hibernate create/alter the tables from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
