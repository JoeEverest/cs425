services:
  mysql:
    image: mysql:8.0
    container_name: lab8-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: studentmgmt
      MYSQL_USER: studentmgmt
      MYSQL_PASSWORD: studentmgmt
    ports:
      - "3307:3306"
    volumes:
      - lab8-mysql-data:/var/lib/mysql

volumes:
  lab8-mysql-data:
