spring.application.name=eRegistrar

# --- MySQL datasource (Docker container from docker-compose.yml, host port 3308) ---
spring.datasource.url=jdbc:mysql://localhost:3308/eregistrar?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=eregistrar
spring.datasource.password=eregistrar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
