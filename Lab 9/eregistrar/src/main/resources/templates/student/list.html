<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eRegistrar - List of Students</title>
    <link href="https://stackpath.bootstrapcdn.com/bootswatch/4.1.2/cosmo/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="/eregistrar/home">eRegistrar</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="/eregistrar/home">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/eregistrar/student/list">List of Students</a></li>
                <li class="nav-item"><a class="nav-link" href="/eregistrar/student/new">Register New Student</a></li>
            </ul>
            <form class="form-inline" action="/eregistrar/student/search" method="get">
                <input class="form-control mr-sm-2" type="search" name="keyword" placeholder="Search students" th:value="${keyword}">
                <button class="btn btn-light my-2 my-sm-0" type="submit">Search</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>List of Registered Students</h2>
        <p th:if="${keyword != null and !keyword.isEmpty()}" class="text-muted">
            Search results for: <strong th:text="${keyword}"></strong>
        </p>

        <a class="btn btn-success mb-3" href="/eregistrar/student/new">+ Register New Student</a>

        <table class="table table-striped table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>#</th>
                    <th>Student Number</th>
                    <th>First Name</th>
                    <th>Middle Name</th>
                    <th>Last Name</th>
                    <th>CGPA</th>
                    <th>Enrollment Date</th>
                    <th>International?</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${students.isEmpty()}">
                    <td colspan="9" class="text-center">No students found.</td>
                </tr>
                <tr th:each="student : ${students}">
                    <td th:text="${student.studentId}"></td>
                    <td th:text="${student.studentNumber}"></td>
                    <td th:text="${student.firstName}"></td>
                    <td th:text="${student.middleName}"></td>
                    <td th:text="${student.lastName}"></td>
                    <td th:text="${student.cgpa}"></td>
                    <td th:text="${student.enrollmentDate}"></td>
                    <td th:text="${student.isInternational}"></td>
                    <td>
                        <a class="btn btn-sm btn-primary" th:href="@{/eregistrar/student/edit/{id}(id=${student.studentId})}">Edit</a>
                        <a class="btn btn-sm btn-danger"
                           th:href="@{/eregistrar/student/delete/{id}(id=${student.studentId})}"
                           onclick="return confirm('Delete this student?');">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
